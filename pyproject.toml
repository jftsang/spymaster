[project]
name = "spymaster"
version = "0.2.0"
description = ""
authors = [{ name = "J. M. F. Tsang", email = "j.m.f.tsang@cantab.net" }]
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "dataclasses_json>=0.6.7",
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",
    "jinja2>=3.1.6",
    "websockets>=17.2",
    "numpy>=2.5.3",
    "tqdm>=4.70.1",
    "commonmark>=0.9.2",
]

[dependency-groups]
dev = [
    "fastapi[standard]>=0.143.0",
    "ruff>=0.16.10",
    "ty>=0.0.85",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spymaster"]
