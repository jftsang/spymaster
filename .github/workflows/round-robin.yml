name: Round-robin tournament

on:
  push:
    branches: [main]

jobs:
  round-robin:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync
      - name: Run round-robin
        run: uv run python -m unittest tests.test_round_robin
        env:
          SPYMASTER_RUN_ROUND_ROBIN: "1"
